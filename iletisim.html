<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The NewYorker Pizza</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <nav class="header">
            <div class="header-logo">
                <a href="index.html">
                    <img src="images/LogoNewyorker.png" alt="Logomuz" style=" width: 100px;
    height: 100px;">
                </a>
            </div>
            <div class="header-box">
                <div class="header-box-content">
                    <a href="hakkimizda.html">Hakkımızda</a>
                </div>
                <div class="header-box-content">
                    <a href="subelerimiz.html">Şubelerimiz</a>
                </div>
                <div class="header-box-content">
                    <a href="menu.html">Menü</a>
                </div>
                <div class="header-box-content">
                    <a href="iletisim.html">İletişim</a>
                </div>
            </div>
        </nav>
    <main class="main-content">
      <section class="contact-section">
        <h2 class="section-title">Bizimle İletişime Geç</h2>
        <form class="contact-form">
          <label for="name">Ad Soyad</label>
          <input type="text" id="name" placeholder="Adınızı girin">

          <label for="email">E-posta</label>
          <input type="email" id="email" placeholder="ornek@mail.com">

          <label for="message">Mesajınız</label>
          <textarea id="message" rows="5" placeholder="Mesajınızı yazın..."></textarea>

          <button type="submit" class="btn-send">Gönder</button>
        </form>

        <div class="contact-info">
          <p>✉️ info@thenewyorkerpizza.com</p>
        </div>
      </section>
    </main>
    </div>
</body>
</html>
